<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Viewer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; }
        #map { position: absolute; top: 40px; bottom: 0; left: 0; right: 0; }
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: #2c5f2d;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            z-index: 1000;
        }
        .header a { color: white; text-decoration: none; margin-right: 20px; }
        .header a:hover { text-decoration: underline; }
        .header .title { font-weight: 600; flex: 1; }
        .header .stats { font-size: 0.85em; opacity: 0.9; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html">&larr; Back</a>
        <span class="title" id="title">Loading...</span>
        <span class="stats" id="stats"></span>
    </div>
    <div id="map"></div>

    <script>
        // Get JSON file(s) from URL parameters
        const params = new URLSearchParams(window.location.search);
        const singleFile = params.get('file');
        const multipleFiles = params.get('files');
        const title = params.get('title');

        // Determine which files to load
        let jsonFiles = [];
        let layerName = '';

        if (multipleFiles) {
            // Multiple files: comma-separated list
            jsonFiles = multipleFiles.split(',').map(f => f.trim());
            layerName = title || jsonFiles.length + ' layers';
        } else if (singleFile) {
            // Single file (backward compatible)
            jsonFiles = [singleFile];
            layerName = singleFile.replace('json/', '').replace('.json', '');
        } else {
            // Default
            jsonFiles = ['json/vt_towns_with_water_cutouts.json'];
            layerName = 'vt_towns_with_water_cutouts';
        }

        document.getElementById('title').textContent = layerName;
        document.title = layerName + ' - Vector Viewer';

        // Initialize map
        const map = L.map('map').setView([44.5, -72.7], 8);

        // Light basemap
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap, &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // Load and display all GeoJSON files
        let totalFeatures = 0;
        let allBounds = null;
        let loadedCount = 0;

        jsonFiles.forEach((jsonFile, index) => {
            fetch(jsonFile)
                .then(response => {
                    if (!response.ok) throw new Error('File not found: ' + jsonFile);
                    return response.json();
                })
                .then(data => {
                    const featureCount = data.features ? data.features.length : 0;
                    totalFeatures += featureCount;
                    loadedCount++;

                    // Update stats as files load
                    if (jsonFiles.length > 1) {
                        document.getElementById('stats').textContent =
                            totalFeatures + ' features (' + loadedCount + '/' + jsonFiles.length + ' files)';
                    } else {
                        document.getElementById('stats').textContent = featureCount + ' features';
                    }

                    const layer = L.geoJSON(data, {
                        style: {
                            color: '#2c5f2d',
                            weight: 1.5,
                            fillColor: '#4a9f4d',
                            fillOpacity: 0.3
                        },
                        onEachFeature: function(feature, layer) {
                            if (feature.properties) {
                                const props = Object.entries(feature.properties)
                                    .filter(([k, v]) => v !== null && v !== '')
                                    .map(([k, v]) => `<strong>${k}:</strong> ${v}`)
                                    .join('<br>');
                                if (props) layer.bindPopup(props);
                            }
                        }
                    }).addTo(map);

                    // Extend bounds to include all layers
                    const bounds = layer.getBounds();
                    if (bounds.isValid()) {
                        if (allBounds) {
                            allBounds.extend(bounds);
                        } else {
                            allBounds = bounds;
                        }
                        // Fit to combined bounds after all files loaded
                        if (loadedCount === jsonFiles.length && allBounds) {
                            map.fitBounds(allBounds, { padding: [20, 20] });
                        }
                    }
                })
                .catch(error => {
                    console.error('Error loading ' + jsonFile + ':', error.message);
                    loadedCount++;
                    if (loadedCount === 1 && jsonFiles.length === 1) {
                        document.getElementById('title').textContent = 'Error: ' + error.message;
                        document.getElementById('stats').textContent = '';
                    }
                });
        });
    </script>
</body>
</html>
